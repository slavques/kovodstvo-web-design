<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Орбита — заявки</title><style>
:root{--brand:#6d28d9;--bg:#f5f3ff;--text:#24153b}*{box-sizing:border-box}body{font:16px Inter,Arial,sans-serif;color:var(--text);background:var(--bg);margin:0}header{background:var(--brand);color:white;padding:24px 5vw}main{max-width:1100px;margin:32px auto;padding:0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border-radius:22px;padding:24px;border:1px solid #e8def7}h1{margin:0}label,input,select,button{display:block;margin-bottom:12px}input,select{padding:12px;width:100%;font:inherit}button{background:var(--brand);color:white;padding:13px 18px;border:0;border-radius:12px;font:inherit;cursor:pointer}table{width:100%;text-align:left}th,td{padding:10px 6px;border-bottom:1px solid #ede7f7}.error{color:#9f1239}a{color:var(--brand)}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style><header><h1>Орбита</h1><p>Заявки на доступ</p></header><main><div class="grid"><section class="card"><h2>Новая заявка</h2><form id="request-form"><label for="name">Имя сотрудника</label><input id="name" name="name" required><label for="email">Рабочая почта</label><input id="email" name="email" type="email" required><label for="role">Роль</label><select id="role" name="role"><option>Наблюдатель</option><option>Редактор</option></select><p id="message" class="error" role="status"></p><button type="submit">Проверить заявку</button></form></section><section class="card"><h2>Последние заявки</h2><table><thead><tr><th>Сотрудник</th><th>Роль</th></tr></thead><tbody><tr><td>Анна</td><td>Редактор</td></tr><tr><td>Марк</td><td>Наблюдатель</td></tr></tbody></table><p>Демонстрационная локальная проверка. Запросы на сервер не отправляются.</p></section></div></main><script>
document.querySelector('#request-form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#message').textContent='В этом примере проверка недоступна. Введённые данные остались в форме.'});
</script></html>
